</head>
<body>
<header class="site-header">
  <nav class="navbar container">
    <a href="index.html" class="brand"><span class="brand-mark">B2B</span><span class="brand-text"><span>Bit2Byte</span><small>KUET</small></span></a>
    <ul class="nav-menu">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="about.html" class="nav-link">About</a></li>
      <li><a href="programs.html" class="nav-link">Programs</a></li>
      <li><a href="projects.html" class="nav-link">Projects</a></li>

    </ul>
  </nav>
</header>

<main class="section section-soft">
  <div class="container" style="max-width: 500px; margin: auto;">
    <h2 style="text-align:center; color: var(--navy);">Contact Us</h2>
    <form action="php/contact.php" method="POST" style="display:flex; flex-direction:column; gap:16px; margin-top:32px;">
      <input type="text" name="name" placeholder="Your Name" required style="padding:12px; border-radius:8px; border:1px solid var(--dark-border);">
      <input type="email" name="email" placeholder="Your Email" required style="padding:12px; border-radius:8px; border:1px solid var(--dark-border);">
      <textarea name="message" placeholder="Your Message" rows="5" required style="padding:12px; border-radius:8px; border:1px solid var(--dark-border);"></textarea>
      <button type="submit" class="btn btn-primary btn-large">Send Message</button>
    </form>
  </div>
</main>

<footer class="site-footer">
  <div class="container" style="text-align:center; color: var(--white); padding:24px 0;">© 2026 Bit2Byte KUET</div>
</footer>
<script src="js/main.js"></script>
