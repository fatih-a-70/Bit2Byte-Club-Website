        </ul>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="section-kicker">Join Us</span>
          <h1>Become a Bit2Byte Member</h1>
          <p>
            Register your interest and create your account for the software
            development community.
          </p>
        </div>
      </section>

      <section class="section section-soft">
        <div class="container form-wrap">
          <form action="php/register.php" method="POST" class="form-card">
            <div class="form-row">
              <div>
                <label for="name">Full Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  placeholder="Enter your full name"
                  required
                />
              </div>
              <div>
                <label for="student_id">Student ID</label>
                <input
                  type="text"
                  id="student_id"
                  name="student_id"
                  placeholder="Example: 2107xxx"
                  required
                />
              </div>
            </div>

            <div class="form-row">
              <div>
                <label for="department">Department</label>
                <input
                  type="text"
                  id="department"
                  name="department"
                  placeholder="Example: CSE"
                  required
                />
              </div>
              <div>
                <label for="batch">Batch</label>
                <input
                  type="text"
                  id="batch"
                  name="batch"
                  placeholder="Example: 2K21"
                  required
                />
              </div>
            </div>

            <div class="form-row">
              <div>
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  required
                />
              </div>
              <div>
                <label for="phone">Phone</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="Enter your phone number"
                  required
                />
              </div>
            </div>

            <div>
              <label for="interest">Interest Area</label>
              <select id="interest" name="interest" required>
                <option value="">Select your interest</option>
                <option value="Programming">Programming</option>
                <option value="Web Development">Web Development</option>
                <option value="Mobile App Development">
                  Mobile App Development
                </option>
                <option value="AI/ML">AI/ML</option>
                <option value="Research">Research</option>
                <option value="Hackathon">Hackathon</option>
                <option value="UI/UX">UI/UX</option>
              </select>
            </div>

            <div class="form-row">
              <div>
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Create your password"
                  required
                />
              </div>
              <div>
                <label for="confirm_password">Confirm Password</label>
                <input
                  type="password"
                  id="confirm_password"
                  name="confirm_password"
                  placeholder="Confirm password"
                  required
                />
              </div>
            </div>

            <div>
              <label for="message">Why do you want to join?</label>
              <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Write a short answer"
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-primary btn-large">
              Submit Registration
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
