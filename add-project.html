<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Project | Bit2Byte KUET</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar container">
        <a href="index.html" class="brand"
          ><span class="brand-mark">B2B</span
          ><span class="brand-text"
            ><span>Bit2Byte</span><small>KUET</small></span
          ></a
        >
        <ul class="nav-menu">
          <li><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
          <li><a href="add-project.html" class="nav-link">Add Project</a></li>
          <li><a href="add-blog.html" class="nav-link active">Add Blog</a></li>
          <li><a href="add-event.html" class="nav-link">Add Event</a></li>
          <li><a href="php/logout.php" class="btn btn-soft">Logout</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <div class="container">
          <span class="section-kicker">Admin</span>
          <h1>Add New Project</h1>
          <p>Fill in Project content to share with members.</p>
        </div>
      </section>

      <section class="section section-soft">
        <div class="container form-wrap">
          <form
            action="php/add-project.php"
            method="POST"
            class="form-card"
            enctype="multipart/form-data"
          >
            <div>
              <label for="title">Project Title</label>
              <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter project title"
                required
              />
            </div>

            <div>
              <label for="content">Content</label>
              <textarea
                id="content"
                name="content"
                rows="8"
                placeholder="Enter full project content"
                required
              ></textarea>
            </div>

            <div>
              <label for="image">Project Cover Image</label>
              <input type="file" id="image" name="image" accept="image/*" />
            </div>

            <div>
              <label for="category">Category / Type</label>
              <input
                type="text"
                id="category"
                name="category"
                placeholder="Tutorial, Resource, Announcement"
                required
              />
            </div>
            <div>
              <label for="link">Project Link</label>
              <input
                type="url"
                id="link"
                name="link"
                placeholder="Enter project URL"
              />
            </div>
            <div style="text-align: center; margin-top: 20px">
              <button type="submit" class="btn btn-primary btn-large">
                Add Project
              </button>
            </div>
          </form>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">© 2026 Bit2Byte KUET</div>
    </footer>
    <script src="js/main.js"></script>
  </body>
</html>
